[tools]
pnpm = "12.16.1"
node = "26.13.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.31.1"
betterleaks = "1.9.0"
lefthook = "2.2.2"
tombi = "1.9.6"
terraform = "1.17.0"
tflint = "0.65.0"
aws-cli = "2.39.0"

[tasks.setup]
description = "環境基盤を最新化"
run = ["mise install", "lefthook install", "pnpm install --frozen-lockfile"]

[tasks.yamllint]
description = "YAML を検証"
raw_args = true
run = "uvx --python-preference only-managed yamllint==1.38.0"

[task_config]
includes = ["mise-tasks/tf.toml"]
