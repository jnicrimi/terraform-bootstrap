[tools]
pnpm = "11.25.0"
node = "24.20.0"
actionlint = "1.7.12"
zizmor = "1.30.0"
gitleaks = "8.30.1"
lefthook = "2.1.12"
taplo = "0.10.0"
terraform = "1.16.0"
tflint = "0.64.0"
aws-cli = "2.36.38"

[tasks.setup]
description = "環境基盤を最新化"
run = ["mise install", "lefthook install", "pnpm install --frozen-lockfile"]

[tasks.yamllint]
description = "YAML を検証"
raw_args = true
run = "uvx --python-preference only-managed yamllint==1.38.0"

[task_config]
includes = ["mise-tasks/tf.toml"]
