[tools]
pnpm = "12.18.0"
node = "26.13.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.32.0"
betterleaks = "1.10.0"
lefthook = "2.2.2"
tombi = "1.11.2"
terraform = "1.17.1"
tflint = "0.66.0"
aws-cli = "2.40.0"

[tasks.setup]
description = "環境基盤を最新化"
run = ["mise install", "lefthook install", "pnpm install --frozen-lockfile"]

[tasks.yamllint]
description = "YAML を検証"
raw_args = true
run = "uvx --python-preference only-managed yamllint==1.38.0"

[task_config]
includes = ["mise-tasks/tf.toml"]
